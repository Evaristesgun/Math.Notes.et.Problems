name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - Build LinearAlgebra PDF
      - Build ExPair PDF
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: main

    # 确保拿到最新 main（含 PDF commit）
    - name: Sync latest commit
      run: |
        git fetch origin main
        git reset --hard origin/main

    # ===== Build website structure =====
    - name: Prepare Pages directory
      run: |
        rm -rf public
        mkdir -p public/LinearAlgebra
        mkdir -p public/ExPair

        if [ -f LinearAlgebra/main.pdf ]; then
          cp LinearAlgebra/main.pdf public/LinearAlgebra/
        fi

        if [ -f ExPair/main.pdf ]; then
          cp ExPair/main.pdf public/ExPair/
        fi

        # optional homepage
        if [ -f index.html ]; then
          cp index.html public/
        fi

    # ===== Deploy =====
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: public
        publish_branch: gh-pages
