name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # ===== Build website structure =====
    - name: Prepare Pages directory
      run: |
        mkdir -p public/LinearAlgebra
        mkdir -p public/ExPair

        # copy PDFs if they exist
        if [ -f LinearAlgebra/main.pdf ]; then
          cp LinearAlgebra/main.pdf public/LinearAlgebra/
        fi

        if [ -f ExPair/main.pdf ]; then
          cp ExPair/main.pdf public/ExPair/
        fi

    # ===== Deploy =====
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: public
        publish_branch: gh-pages
