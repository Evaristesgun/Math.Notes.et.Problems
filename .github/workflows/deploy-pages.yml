name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_run:
    workflows:
      - Build LinearAlgebra PDF
      - Build ExPair PDF
      - Build Analysis PDF
    types:
      - completed

jobs:
  deploy:
    if: |
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    # ===== Sync latest main commit =====
    - name: Sync latest commit
      run: |
        git fetch origin main
        git reset --hard origin/main

    # ===== Build website structure =====
    - name: Prepare Pages directory
      run: |
        rm -rf public

        # ===== Main projects =====
        mkdir -p public/LinearAlgebra
        mkdir -p public/ExPair
        mkdir -p public/Problems_in_Mathematical_Analysis

        # ===== Copy compiled PDFs =====
        if [ -f LinearAlgebra/main.pdf ]; then
          cp LinearAlgebra/main.pdf public/LinearAlgebra/
        fi

        if [ -f ExPair/main.pdf ]; then
          cp ExPair/main.pdf public/ExPair/
        fi

        if [ -f Problems_in_Mathematical_Analysis/main.pdf ]; then
          cp Problems_in_Mathematical_Analysis/main.pdf public/Problems_in_Mathematical_Analysis/
        fi

        # ===== Copy additional documents =====
        if [ -f GaussInteger.pdf ]; then
          cp GaussInteger.pdf public/
        fi

        if [ -f NoteForSieveTheory.pdf ]; then
          cp NoteForSieveTheory.pdf public/
        fi

        if [ -f ReviewFORTuesday.pdf ]; then
          cp ReviewFORTuesday.pdf public/
        fi

        # ===== Copy homepage =====
        if [ -f index.html ]; then
          cp index.html public/
        fi

        # ===== Verify deployment files =====
        echo "===== Files to be deployed ====="
        find public -maxdepth 2 -type f -print

    # ===== Deploy =====
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: public
        publish_branch: gh-pages
