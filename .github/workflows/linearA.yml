name: Build LinearAlgebra

on:
  push:
    paths:
      - 'LinearAlgebra/**'
    paths-ignore:
      - 'LinearAlgebra/*.pdf'

jobs:
  build:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: xu-cheng/latex-action@v3
      with:
        root_file: LinearAlgebra/main.tex

    - name: Commit PDF
      run: |
        git config --local user.name "github-actions"
        git config --local user.email "github-actions@github.com"

        git add LinearAlgebra/main.pdf

        git commit -m "Update Project A PDF" || echo "No changes"

        git push
