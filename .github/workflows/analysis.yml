name: Build Analysis PDF

on:
  push:
    paths:
      - 'Problems_in_Mathematical_Analysis/**'

jobs:
  build:
    # avoid infinite loop
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ===== Compile =====
    - uses: xu-cheng/latex-action@v3
      with:
        root_file: Problems_in_Mathematical_Analysis/main.tex
        work_in_root_file_dir: true

    # ===== Commit PDF back =====
    - name: Commit PDF
      run: |
        git config --local user.name "github-actions"
        git config --local user.email "github-actions@github.com"

        git add Problems_in_Mathematical_Analysis/main.pdf

        # stop if nothing changed
        git diff --cached --quiet && echo "No PDF changes" && exit 0

        git commit -m "Update Analysis PDF"

        # sync latest main to avoid push conflicts
        git pull --rebase origin main

        git push
